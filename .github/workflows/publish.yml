name: Build, Test & Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for nuget.org Trusted Publishing (exchanged by NuGet/login below)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Koto.slnx

      - name: Build
        run: dotnet build Koto.slnx --no-restore -c Release /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Koto.slnx --no-build -c Release --logger "console;verbosity=minimal"

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          dotnet pack Koto.slnx --no-build -c Release /p:Version=$VERSION -o ./artifacts

      # nuget.org Trusted Publishing: the policy on nuget.org (owner arigatory, repository arigatory/Koto,
      # workflow publish.yml, no environment, glob Koto.*) trusts this workflow's OIDC token; NuGet/login
      # exchanges it for an API key that lives one hour. There is no long-lived secret that can expire.
      - name: NuGet login (OIDC → temporary API key)
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: arigatory   # nuget.org profile name, not an email

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for pkg in ./artifacts/*.nupkg ./artifacts/*.snupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
